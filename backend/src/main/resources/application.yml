app:
  # 同一镜像支持 api、migrate、seed、worker 四种部署任务。
  mode: ${APP_MODE:api}

idolradar:
  guard:
    # 一个用户能同时守护多少位 idol 由服务端决定。客户端类型取自会话上记录的
    # client_type（登录时写入，不接受客户端传入），未在下表出现的类型走 default-limit。
    default-limit: ${IDOLRADAR_GUARD_DEFAULT_LIMIT:1}
    limits:
      # 微信小程序固定为 1：上限为 1 时「换人即替换」，不会把第二次守护判为超限。
      wechat-miniprogram: ${IDOLRADAR_GUARD_LIMIT_WECHAT_MINIPROGRAM:1}
  admin:
    # 管理员会话短于小程序会话；生产环境可通过 IDOLRADAR_ADMIN_SESSION_TTL 覆盖。
    session-ttl: ${IDOLRADAR_ADMIN_SESSION_TTL:12h}
  wechat:
    # AppID 不是密钥；AppSecret 只允许通过环境变量 IDOLRADAR_WECHAT_APP_SECRET 注入。
    app-id: ${IDOLRADAR_WECHAT_APP_ID:wxa04d57df55d8473d}

spring:
  application:
    name: idolradar-backend
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 本机直接运行 Java 时使用；Docker/生产环境通过 SPRING_DATASOURCE_* 覆盖。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/idolradar_java}
    username: ${SPRING_DATASOURCE_USERNAME:idolradar}
    password: ${SPRING_DATASOURCE_PASSWORD:idolradar}
    hikari:
      # 虚拟线程不等于无限数据库并发；连接池保持小而有界，保护 PostgreSQL。
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      # 本机 Java 连接宿主机 Redis；容器内由 Compose 覆盖为 redis:6379。
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:16379}
  flyway:
    # API/Worker 默认禁止 DDL；仅一次性 migrate 任务通过环境变量显式开启。
    enabled: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

management:
  # 本机直跑只监听回环；Docker 内由 Compose 改为 0.0.0.0，再通过宿主机回环端口转发。
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      access: read-only
  metrics:
    tags:
      mode: ${APP_MODE:api}

logging:
  level:
    root: INFO
  pattern:
    level: "%5p [${spring.application.name:idolradar-backend},%X{requestId:-}]"
