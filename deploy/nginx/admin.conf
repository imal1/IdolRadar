# IdolRadar 管理后台公网入口范本。
#
# 本文件不由 Compose、CI 或任何脚本自动部署。宿主机 Nginx 不在本仓库的管理范围内，
# 需要人工复制到服务器并 include 进已有的 443 server 块：
#
#   cp deploy/nginx/admin.conf /etc/nginx/idolradar/admin.conf
#   # 在 server { listen 443 ssl; server_name app.imali.top; ... } 内加一行：
#   #   include /etc/nginx/idolradar/admin.conf;
#   nginx -t && systemctl reload nginx
#
# 管理端产物随 backend 镜像发布，与 /admin/v1/** 同源，因此这里只做路由与转发，
# 不单独托管静态文件；取舍见 docs/adr/0003-admin-web-separate-source-same-origin-runtime.md。
#
# 安全响应头（CSP、X-Frame-Options、Referrer-Policy、X-Content-Type-Options、
# X-Robots-Tag、Cache-Control）由后端 SecurityHeadersFilter 统一下发，本文件不重复设置：
# 同一份 CSP 写在两处必然漂移，而漂移后的症状是管理页白屏，排查成本远高于收益。
# 若外层 http/server 块已有全局 add_header，反向代理响应会出现两条互相冲突的同名头；
# 正确做法是删掉全局那条，或在本 location 内用 proxy_hide_header 去掉后端那条，二选一。
#
# 访问控制这一版只做应用层管理员登录：管理员没有固定出口 IP，
# IP allowlist 会立刻退化成一个天天要开的临时口子。日后需要时再加是一行配置。

location /admin/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # 后端以 SERVER_FORWARD_HEADERS_STRATEGY=framework 读取这两条判断真实协议与来源，
    # 缺失时登录重定向和审计日志里的客户端信息都会失真。
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 管理端只提交小体积表单与 JSON，限制请求体可缩小攻击面。
    client_max_body_size 1m;

    # nginx 对「以 / 结尾的 location + proxy_pass」会自动把 /admin 301 到 /admin/，
    # 默认用监听端口拼绝对地址，在 443 后面会跳成 http://域名:端口/admin/——
    # 既降级协议又泄露内部端口。改发相对 Location，由浏览器按原 scheme 和 host 解析。
    absolute_redirect off;

    # 不要在这里加 expires 或 add_header Cache-Control：
    # 缓存策略由后端按路径下发——/admin/assets/ 下的指纹产物长缓存且 immutable，
    # 入口 HTML 与全部 /admin/v1/** 响应 no-store。在 Nginx 覆盖成统一值会产生
    # 「新 JS 配旧 HTML」或反过来的发版错配，表现为管理端间歇性白屏或调用不存在的接口。
}
