name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional Docker image tag; defaults to manual-<commit SHA>
        required: false
        type: string
      reuse_current_rsshub:
        description: Reuse the running RSSHub image when its source has not changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish private images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      rsshub_image: ${{ steps.images.outputs.rsshub }}
      image_tag: ${{ steps.images.outputs.tag }}
      rsshub_tag: ${{ steps.images.outputs.rsshub_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # 管理端源码在 packages/admin-web，而镜像构建上下文是 ./backend：
      # 必须先把产物构建进 backend 静态资源目录，镜像里的 /admin/ 才有内容。
      - name: Build admin frontend into backend static resources
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run admin:build

      - name: Resolve image names
        id: images
        shell: bash
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          case "$GITHUB_EVENT_NAME" in
            push)
              image_tag="$PUSH_TAG"
              ;;
            workflow_dispatch)
              image_tag="${MANUAL_TAG:-manual-${GITHUB_SHA:0:12}}"
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag: $image_tag"
            exit 1
          fi
          echo "backend=${REGISTRY}/${owner}/idolradar-backend" >> "$GITHUB_OUTPUT"
          echo "rsshub=${REGISTRY}/${owner}/idolradar-rsshub" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          rsshub_revision="$(git -C rsshub rev-parse --verify HEAD)"
          echo "rsshub_tag=rsshub-${rsshub_revision:0:12}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.backend }}
          tags: |
            type=raw,value=${{ steps.images.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: RSSHub image metadata
        id: rsshub-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.rsshub }}
          tags: |
            type=raw,value=${{ steps.images.outputs.rsshub_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish RSSHub image
        uses: docker/build-push-action@v6
        with:
          context: ./rsshub
          file: ./rsshub/Dockerfile
          push: true
          tags: ${{ steps.rsshub-meta.outputs.tags }}
          labels: ${{ steps.rsshub-meta.outputs.labels }}
          # 不内置 Chromium：当前 seed 只有 /weibo/user 一条 route，走 m.weibo.cn JSON 接口，
          # 不开浏览器。省下的 Chromium 层与图形库依赖直接缩短服务器跨境拉取镜像的耗时。
          # 将来接入需要浏览器的 route（抖音、小红书）时改回 0。
          build-args: |
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          cache-from: type=gha,scope=rsshub
          cache-to: type=gha,mode=max,scope=rsshub

  deploy:
    name: Deploy images to server
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release bundle and environment
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}:${{ needs.publish.outputs.image_tag }}
          RSSHUB_IMAGE: ${{ needs.publish.outputs.rsshub_image }}:${{ needs.publish.outputs.rsshub_tag }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV_FILE"
          bundle_dir="$RUNNER_TEMP/idolradar-release"
          install -d -m 700 "$bundle_dir"
          cp compose.yaml "$bundle_dir/compose.yaml"
          cp -R database "$bundle_dir/"
          install -m 600 /dev/null "$bundle_dir/.env"
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$bundle_dir/.env"
          sed -i '/^IDOLRADAR_IMAGE=/d; /^RSSHUB_IMAGE=/d' "$bundle_dir/.env"
          {
            printf '\n'
            printf 'IDOLRADAR_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'RSSHUB_IMAGE=%s\n' "$RSSHUB_IMAGE"
          } >> "$bundle_dir/.env"
          # Compose 缺省值保持 false；生产必须显式开启，否则抓取正常但通知 outbox 不消费。
          if ! docker compose \
            --env-file "$bundle_dir/.env" \
            -f "$bundle_dir/compose.yaml" \
            config --format json |
            jq -e '.services.worker.environment.IDOLRADAR_WORKER_NOTIFICATIONS_ENABLED == "true"' >/dev/null; then
            echo "::error::production/PRODUCTION_ENV_FILE 必须显式设置 NOTIFICATIONS_ENABLED=true"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/idolradar_deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/idolradar_deploy"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Transfer release bundle
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_path="${DEPLOY_PATH:-/opt/idolradar}"
          [[ "$deploy_port" =~ ^[0-9]+$ ]]
          [[ "$deploy_path" =~ ^/[A-Za-z0-9._/-]+$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh_args=(-i "$HOME/.ssh/idolradar_deploy" -p "$deploy_port" -o KexAlgorithms=curve25519-sha256 "$DEPLOY_USER@$DEPLOY_HOST")
          tar -C "$RUNNER_TEMP/idolradar-release" -czf - . |
            ssh "${ssh_args[@]}" "install -d -m 700 '$deploy_path' && tar -xzf - -C '$deploy_path'"

      - name: Transfer private images and deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}:${{ needs.publish.outputs.image_tag }}
          RSSHUB_IMAGE: ${{ needs.publish.outputs.rsshub_image }}:${{ needs.publish.outputs.rsshub_tag }}
          REUSE_CURRENT_RSSHUB: ${{ inputs.reuse_current_rsshub }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_path="${DEPLOY_PATH:-/opt/idolradar}"
          ssh_args=(-i "$HOME/.ssh/idolradar_deploy" -p "$deploy_port" -o KexAlgorithms=curve25519-sha256 "$DEPLOY_USER@$DEPLOY_HOST")
          # 生产机直连 GHCR 极慢；由 Runner 下载后经 SSH 流式导入，避免发布被跨境拉取阻塞。
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_USER" --password-stdin
          docker pull "$BACKEND_IMAGE"
          docker pull "$RSSHUB_IMAGE"
          # 首次切换到源码版本标签时，可复用已运行且确认源码未变的 RSSHub 镜像。
          if [[ "${REUSE_CURRENT_RSSHUB:-false}" == "true" ]] &&
             ! ssh "${ssh_args[@]}" "docker image inspect '$RSSHUB_IMAGE' >/dev/null 2>&1"; then
            ssh "${ssh_args[@]}" "
              set -eu
              current_container=\$(cd '$deploy_path' && docker compose ps -q rsshub)
              test -n \"\$current_container\"
              current_image_id=\$(docker inspect --format '{{.Image}}' \"\$current_container\")
              docker tag \"\$current_image_id\" '$RSSHUB_IMAGE'
            "
          fi
          for image in "$BACKEND_IMAGE" "$RSSHUB_IMAGE"; do
            if ssh "${ssh_args[@]}" "docker image inspect '$image' >/dev/null 2>&1"; then
              echo "Image already imported: $image"
              continue
            fi
            # 逐个导入并使用最高 gzip 压缩；超时重跑时可跳过已完成镜像。
            docker save "$image" |
              gzip -9 |
              ssh "${ssh_args[@]}" "gzip -dc | docker load"
          done
          ssh "${ssh_args[@]}" "
            set -eu
            cd '$deploy_path'
            docker compose up -d --no-build --remove-orphans
            docker compose ps
          "

      - name: Remove runner secrets
        if: always()
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/idolradar-release"
          rm -f "$HOME/.ssh/idolradar_deploy"
