name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Java unit tests
        run: mvn -B -f backend/pom.xml test

      - name: PostgreSQL migration and seed integration tests
        run: mvn -B -f backend/pom.xml -Pintegration-test -Didolradar.it.enabled=true verify

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Mini program contract and release checks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run validate
          docker compose --env-file .env.example config --quiet

      - name: Production image build
        run: docker build --tag idolradar-ci backend
